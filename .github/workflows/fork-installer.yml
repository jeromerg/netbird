name: Fork installer (side-by-side installations)

# Builds an unsigned NSIS installer that supports named installations, for the
# fork. Modelled on the NSIS job of release.yml, without signing.
#
# Start a build with a tag sbs-v<upstream version>+sbs.<n>, for example
# sbs-v0.81.5+sbs.1, or by pushing a branch sbs-build/<upstream version>+sbs.<n>
# for clients that may push branches but not tags. The tags do not start with
# "v", so they do not start release.yml or sync-tag.yml, which react to
# upstream release tags. Both also create a draft release sbs-v<version> with
# the installer attached.

on:
  push:
    tags:
      - "sbs-v*"
    branches:
      - "sbs-build/*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version as <upstream version>+sbs.<n>, for example 0.81.5+sbs.1"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      appver: ${{ steps.parse.outputs.appver }}
      major: ${{ steps.parse.outputs.major }}
      minor: ${{ steps.parse.outputs.minor }}
      patch: ${{ steps.parse.outputs.patch }}
    steps:
      - name: Parse version
        id: parse
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref="${REF_NAME#sbs-v}"
          version="${INPUT_VERSION:-${ref#sbs-build/}}"
          # Build metadata (+sbs.n) is ignored by version comparisons, so the
          # updater and posture checks see the upstream version. A pre-release
          # suffix would sort below it.
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)\+sbs\.([0-9]+)$ ]]; then
            echo "::error::version '$version' is not <major>.<minor>.<patch>+sbs.<n>"
            exit 1
          fi
          {
            echo "version=$version"
            echo "major=${BASH_REMATCH[1]}"
            echo "minor=${BASH_REMATCH[2]}"
            echo "patch=${BASH_REMATCH[3]}"
            # NSIS VIProductVersion takes four numbers only.
            echo "appver=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}"
          } >> "$GITHUB_OUTPUT"

  binaries:
    name: Build Windows binaries
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MAJOR: ${{ needs.version.outputs.major }}
      MINOR: ${{ needs.version.outputs.minor }}
      PATCH: ${{ needs.version.outputs.patch }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install build dependencies
        run: sudo apt update && sudo apt install -y -q libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev gcc-mingw-w64-x86-64

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@b66839b # v1.7.0

      - name: Install wails3 CLI
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Build the UI frontend
        run: |
          (cd client/ui && wails3 generate bindings -clean=true -ts)
          (cd client/ui/frontend && pnpm install --frozen-lockfile && pnpm build)

      - name: Generate Windows resources
        run: |
          goversioninfo -64 -icon client/ui/build/windows/icon.ico -manifest client/manifest.xml \
            -product-name NetBird -copyright "NetBird GmbH" \
            -ver-major "$MAJOR" -ver-minor "$MINOR" -ver-patch "$PATCH" -ver-build 0 \
            -file-version "$MAJOR.$MINOR.$PATCH.0" -product-version "$MAJOR.$MINOR.$PATCH.0" \
            -o client/resources_windows_amd64.syso
          goversioninfo -64 -icon client/ui/build/windows/icon.ico -manifest client/ui/build/windows/wails.exe.manifest \
            -product-name NetBird-UI -copyright "NetBird GmbH" \
            -ver-major "$MAJOR" -ver-minor "$MINOR" -ver-patch "$PATCH" -ver-build 0 \
            -file-version "$MAJOR.$MINOR.$PATCH.0" -product-version "$MAJOR.$MINOR.$PATCH.0" \
            -o client/ui/resources_windows_amd64.syso

      - name: Build netbird.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          go build -tags load_wgnt_from_rsrc \
            -ldflags "-s -w -X github.com/netbirdio/netbird/version.version=$VERSION" \
            -o dist/netbird_windows_amd64/netbird.exe ./client

      - name: Build netbird-ui.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
        run: |
          cd client/ui
          go build -tags production \
            -ldflags "-s -w -X github.com/netbirdio/netbird/version.version=$VERSION -H windowsgui" \
            -o ../../dist/netbird_windows_amd64/netbird-ui.exe .

      - name: Upload binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-binaries
          path: dist/
          retention-days: 3

  installer:
    name: Build NSIS installer
    needs: [version, binaries]
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    env:
      downloadPath: '${{ github.workspace }}\temp'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Add 7-Zip to PATH
        run: echo "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries
          path: dist

      - name: Download wintun
        uses: netbirdio/shared-actions/actions/win-download-and-verify@be5df6047383da2236e02243cceb857d8567c27e # v0.0.2
        with:
          url: https://pkgs.netbird.io/wintun/wintun-0.14.1.zip
          destination: ${{ env.downloadPath }}\wintun.zip
          sha256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51

      - name: Move wintun.dll into dist
        run: |
          tar -xvf "${{ env.downloadPath }}\wintun.zip" -C ${{ env.downloadPath }}
          mv ${{ env.downloadPath }}\wintun\bin\amd64\wintun.dll ${{ github.workspace }}\dist\netbird_windows_amd64\

      - name: Download EnVar plugin for NSIS
        uses: netbirdio/shared-actions/actions/win-download-and-verify@be5df6047383da2236e02243cceb857d8567c27e # v0.0.2
        with:
          url: https://pkgs.netbird.io/nsis/EnVar_plugin.zip
          destination: ${{ github.workspace }}\envar_plugin.zip
          sha256: e9aa92de351345ed82795251d838f1ae9041ba35af9d381a5780c7843b01f56a

      - name: Download ShellExecAsUser plugin for NSIS
        uses: netbirdio/shared-actions/actions/win-download-and-verify@be5df6047383da2236e02243cceb857d8567c27e # v0.0.2
        with:
          url: https://pkgs.netbird.io/nsis/ShellExecAsUser_amd64-Unicode.7z
          destination: ${{ github.workspace }}\ShellExecAsUser_amd64-Unicode.7z
          sha256: 0a55ea25c7330a92cec028eda8afcaf1b1a7092e0dfb77c21c8f654564b4ff9d

      - name: Extract NSIS plugins
        run: |
          7z x -o"${{ github.workspace }}/NSIS_Plugins" "${{ github.workspace }}/envar_plugin.zip"
          7z x -o"${{ github.workspace }}/NSIS_Plugins" "${{ github.workspace }}/ShellExecAsUser_amd64-Unicode.7z"

      - name: Set up Go for wails3 CLI
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Install wails3 CLI
        shell: bash
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Stage WebView2 bootstrapper
        shell: bash
        run: wails3 generate webview2bootstrapper -dir client

      - name: Build NSIS installer
        shell: pwsh
        env:
          APPVER: ${{ needs.version.outputs.appver }}
          DISPLAY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $nsisPluginDir = "C:\Program Files (x86)\NSIS\Plugins\x86-unicode"
          $srcPlugins    = "${{ github.workspace }}\NSIS_Plugins\Plugins"
          Get-ChildItem -Path $srcPlugins -Recurse -Filter *.dll |
            Copy-Item -Destination $nsisPluginDir -Force
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V4 "/DARCH=amd64" "/DDISPLAY_VERSION=$env:DISPLAY_VERSION" client\installer.nsis
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: netbird-installer-${{ needs.version.outputs.version }}
          path: netbird-installer.exe
          retention-days: 30

  release:
    name: Draft release
    needs: [version, installer]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: netbird-installer-${{ needs.version.outputs.version }}
          path: installer

      # A draft fires no "published" event, so forum.yml, which announces
      # upstream releases, does not run in the fork.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          file="netbird-installer-$VERSION.exe"
          mv installer/netbird-installer.exe "$file"
          sha256sum "$file" > "$file.sha256"
          gh release create "sbs-v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease \
            --title "NetBird $VERSION, side-by-side installations (unsigned)" \
            --notes "Unsigned test build of the side-by-side installations branch, from commit $GITHUB_SHA." \
            "$file" "$file.sha256"
